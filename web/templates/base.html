<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Модульное приложение{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">
<header>
<h1>Модульное приложение для производства</h1>
<nav><a href="/">Главная</a><a href="/feedback">Хотелки</a><a href="/about">О системе</a></nav>
</header>
{% with msgs = get_flashed_messages() %}{% if msgs %}<div class="flash">{% for m in msgs %}<div>{{ m }}</div>{% endfor %}</div>{% endif %}{% endwith %}
<main>{% block content %}{% endblock %}</main>
<footer><p>Версия 0.3.0 | ядро + модули | Flask + SQLAlchemy</p></footer>
</div>
</body>
</html>
