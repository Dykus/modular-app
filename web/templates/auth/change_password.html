{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="welcome"><h2>Смена пароля</h2>
{% if forced %}<p style="color:#e74c3c;font-weight:600">Требуется сменить пароль при первом входе.</p>{% endif %}</div>
<form method="post" action="{{ url_for('auth.do_change_password') }}" class="form-row" style="flex-direction:column;align-items:stretch;gap:10px;max-width:380px">
<label>Старый пароль<input type="password" name="old" required style="width:100%;margin-top:4px"></label>
<label>Новый пароль<input type="password" name="new" required minlength="4" style="width:100%;margin-top:4px"></label>
<label>Повторите новый<input type="password" name="repeat" required minlength="4" style="width:100%;margin-top:4px"></label>
<button class="btn" type="submit">Сохранить новый пароль</button>
</form>
{% endblock %}
