{% extends "base.html" %}
{% block title %}Правка раздела руководства{% endblock %}
{% block content %}
<p><a href="{{ url_for('manual.index') }}" class="btn gray">← К руководству</a></p>
<div class="welcome" style="margin-top:10px">
<h2>Правка раздела: «{{ section.title }}»</h2>
<p>Пишите plainly, шагами, как для нового сотрудника. Переносы строк сохраняются.</p>
</div>
<form method="post" action="{{ url_for('manual.save') }}" class="form-row" style="flex-direction:column;align-items:stretch;gap:10px">
<input type="hidden" name="id" value="{{ section.id }}">
<label>Заголовок раздела
<input type="text" name="title" value="{{ section.title }}" required style="width:100%;margin-top:4px"></label>
<label>Порядок (число, меньше — выше)
<input type="number" name="order" value="{{ section.order }}" style="width:120px;margin-top:4px"></label>
<textarea name="body" style="min-height:320px;padding:10px;border:1px solid #d6dbe4;border-radius:6px;font-size:14px;font-family:inherit">{{ section.body }}</textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input type="text" name="who" placeholder="Кто редактирует" required style="min-width:180px">
<button class="btn" type="submit">💾 Сохранить раздел</button>
<a href="{{ url_for('manual.index') }}" class="btn gray">Отмена</a>
</div>
</form>
{% endblock %}
